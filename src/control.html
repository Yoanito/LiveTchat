<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>LiveTchat</title>
  <link rel="stylesheet" href="control.css">
</head>
<body>
  <h1>LiveTchat</h1>

  <section>
    <h2>Salon</h2>
    <label>Pseudo
      <input type="text" id="name" maxlength="32" placeholder="Ton pseudo">
    </label>

    <div id="roomOut">
      <button id="host" class="primary">Héberger un salon</button>
      <label>Ou rejoindre avec une adresse
        <input type="text" id="address" placeholder="lt://1.2.3.4:41234/…" spellcheck="false">
      </label>
      <button id="join">Rejoindre</button>
    </div>

    <div id="roomIn" hidden>
      <p id="roomState"></p>
      <div id="hostInfo" hidden>
        <p class="address">
          Adresse à donner aux amis :<br>
          <code id="publicAddress"></code>
          <button id="copyPublic">Copier</button>
        </p>
        <p id="internetHelp" class="help"></p>
        <p class="address" id="lanBlock">
          Sur le même réseau local :<br>
          <code id="lanAddress"></code>
          <button id="copyLan">Copier</button>
        </p>
      </div>
      <h3>Membres</h3>
      <ul id="members"></ul>
      <button id="leave">Quitter le salon</button>
    </div>
    <p id="roomError" class="error-text"></p>
  </section>

  <section>
    <h2>Affichage chez moi</h2>
    <label>Écran
      <select id="display"></select>
    </label>
    <p class="zone">
      Zone : <span id="zoneLabel"></span><br>
      <button id="editZone">Définir la zone</button>
      <button id="fullZone">Plein écran</button>
    </p>
    <label class="inline"><input type="checkbox" id="sound"> Son</label>
    <label>Volume <output id="volumeOut"></output>
      <input type="range" id="volume" min="0" max="100" step="1">
    </label>
    <label>Opacité <output id="opacityOut"></output>
      <input type="range" id="opacity" min="10" max="100" step="5">
    </label>
    <label>Taille max des médias quand j'héberge (Mo)
      <input type="number" id="maxSizeMb" min="1" max="500" step="1">
    </label>
    <label class="inline"><input type="checkbox" id="upnp"> Ouvrir le port de ma box automatiquement</label>
    <label>Port quand j'héberge
      <input type="number" id="port" min="1024" max="65535" step="1">
    </label>
  </section>

  <section>
    <h2>Envoyer un média</h2>
    <p class="file">
      <button id="pick">Choisir une image ou une vidéo</button>
      <span id="fileName">Aucun fichier</span>
    </p>
    <label>Texte (optionnel)
      <input type="text" id="text" maxlength="200" placeholder="Ton message">
    </label>
    <label>Durée d'affichage d'une image (s)
      <input type="number" id="imageSeconds" min="1" max="30" value="5">
    </label>
    <button id="sendRoom" class="primary" disabled>Envoyer au salon</button>
    <details>
      <summary>Tester seulement chez moi</summary>
      <label>Délai avant affichage (s), le temps de revenir en jeu
        <input type="number" id="delay" min="0" max="60" value="5">
      </label>
      <button id="send">Afficher chez moi</button>
    </details>
    <p id="status" role="status"></p>
  </section>

  <script src="control.js"></script>
</body>
</html>
